<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso facebook</title>
  <style>
    body {
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: white;
      width: 300px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo {
      font-weight: bold;
      color: #4a90e2;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .description {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .facebook-btn {
      background-color: #1877f2;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      width: 100%;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .divider {
      margin: 15px 0;
      color: #999;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-btn {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      margin-top: 10px;
    }

    .create-account {
      background-color: #34c759;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      margin-top: 15px;
      font-weight: bold;
    }

    .forgot-password {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      color: #999;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">Facebook<span style="color: #4a90e2;"></span></div>
    <div class="description">Felicidades amigo te ayuda a guardar y<br>compartir tus recuerdos de viaje.</div>

    <button class="facebook-btn">Continuar con Facebook</button>

    <div class="divider">o</div>

    <input type="text" placeholder="Usuario o correo electrónico">
    <input type="password" placeholder="Contraseña">
    <button class="login-btn">Iniciar sesión</button>

    <button class="create-account">Crear nueva cuenta</button>
    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
  </div>
</body>
</html>
